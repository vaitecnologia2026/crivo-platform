server {
    listen 80;
    listen [::]:80;
    server_name app.crivolegacy.com.br;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.crivolegacy.com.br;
    ssl_certificate /etc/ssl/crivo/fullchain.pem;
    ssl_certificate_key /etc/ssl/crivo/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 15M;

    location /api/ {
        proxy_pass http://127.0.0.1:3046;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # API nunca cacheada pelo navegador (funil/dados sempre frescos)
        proxy_hide_header Cache-Control;
        proxy_hide_header ETag;
        add_header Cache-Control "no-store, must-revalidate" always;
    }
    # Manual do Super Admin (documentacao estatica, publica). Servido do proprio
    # VPS; precede o location / do app Next.js. Forma minima com alias: serve
    # index.html e todos os assets sob /ajuda/ sem a pegadinha alias+regex.
    location = /ajuda { return 301 /ajuda/; }
    location /ajuda/ {
        alias /var/www/crivo-ajuda/;
        index index.html;
        try_files $uri $uri/ =404;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
